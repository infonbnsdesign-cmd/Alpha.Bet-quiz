<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPHA.bet 2026 — 3-Panel Simulation Studio</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            background: #040711;
        }
        .split-header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            background: #090e1f;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .split-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .split-header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .code-display {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid #8b5cf6;
            color: #c4b5fd;
            font-family: var(--font-mono);
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.2em;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        .split-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            height: calc(100vh - 60px);
            width: 100%;
        }
        .split-col {
            display: flex;
            flex-direction: column;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        .split-col:last-child {
            border-right: none;
        }
        .col-banner {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0c142b;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .col-banner a {
            color: #00f0ff;
            text-decoration: none;
            font-size: 0.7rem;
        }
        .col-banner a:hover {
            text-decoration: underline;
        }
        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
        }
        .new-comp-btn {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            border: none;
            color: #ffffff;
            font-weight: 800;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .new-comp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }
    </style>
</head>
<body>
    <header class="split-header">
        <div class="split-header-left">
            <a href="/" style="color: #ffffff; text-decoration: none; font-weight: 900; font-size: 1.1rem; letter-spacing: 0.1em;">
                ALPHA<span style="color:#00f0ff;">.BET</span> 2026
            </a>
            <span style="font-size: 0.75rem; font-weight: 800; background: rgba(0,240,255,0.1); border: 1px solid #00f0ff; color: #00f0ff; padding: 0.2rem 0.6rem; border-radius: 999px;">
                LIVE 3-PANEL SIMULATION STUDIO
            </span>
        </div>
        <div class="split-header-right">
            <div class="code-display" id="simCodeDisplay">Loading...</div>
            <button class="new-comp-btn" onclick="createNewSimulation()">+ New Competition</button>
        </div>
    </header>

    <div class="split-grid">
        <!-- 1. STUDENT PANEL -->
        <div class="split-col">
            <div class="col-banner">
                <span style="color: #00f0ff;">1. Student / Preview Panel (Question Selector)</span>
                <a href="#" id="openStudentFullscreen" target="_blank">Open Fullscreen ↗</a>
            </div>
            <iframe id="studentFrame" title="Student Panel"></iframe>
        </div>

        <!-- 2. TEACHER CONTROL PANEL -->
        <div class="split-col">
            <div class="col-banner">
                <span style="color: #f59e0b;">2. Teacher / Judge Control Panel (Evaluator)</span>
                <a href="#" id="openControlFullscreen" target="_blank">Open Fullscreen ↗</a>
            </div>
            <iframe id="controlFrame" title="Teacher Control Panel"></iframe>
        </div>

        <!-- 3. DISPLAY / OBS PANEL -->
        <div class="split-col">
            <div class="col-banner">
                <span style="color: #c4b5fd;">3. Display / OBS Panel (Broadcast Read-Only)</span>
                <a href="#" id="openDisplayFullscreen" target="_blank">Open Fullscreen ↗</a>
            </div>
            <iframe id="displayFrame" title="Display / OBS Panel"></iframe>
        </div>
    </div>

    <script>
        // Generate a random competition code for this simulation session
        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        let currentCode = null;

        function setCode(code) {
            currentCode = code;
            document.getElementById('simCodeDisplay').textContent = `Code: ${code}`;
            
            // Update iframe sources and fullscreen links
            const baseUrl = window.location.origin;
            const studentUrl = `${baseUrl}/student/${code}`;
            const controlUrl = `${baseUrl}/control/${code}`;
            const displayUrl = `${baseUrl}/display/${code}`;
            
            document.getElementById('studentFrame').src = studentUrl;
            document.getElementById('controlFrame').src = controlUrl;
            document.getElementById('displayFrame').src = displayUrl;
            
            document.getElementById('openStudentFullscreen').href = studentUrl;
            document.getElementById('openControlFullscreen').href = controlUrl;
            document.getElementById('openDisplayFullscreen').href = displayUrl;
        }

        function createNewSimulation() {
            const code = generateCode();
            setCode(code);
        }

        // Initialize with a random code on load
        createNewSimulation();
    </script>
</body>
</html>
